<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>IceBreakers | Facilitator Deck</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;margin:auto;padding:22px 16px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:1.65rem;margin:0}small,.muted{color:#687487}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0 12px}select,button{font:inherit;border:1px solid #d9dfeb;border-radius:12px;padding:11px;background:white;color:#172033}button{cursor:pointer}button:hover{border-color:#6678a0}button:focus-visible,select:focus-visible{outline:3px solid #8fa7ff}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.actions button{font-size:.9rem}.card{background:#fff;border:1px solid #e3e7ef;border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:0 16px 40px #15254312;min-height:390px;touch-action:pan-y}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#526b9d;font-size:.75rem;font-weight:750}.card h2{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.13;margin:15px 0}.prompt{font-size:1.15rem;line-height:1.55}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{background:#edf2fa;border-radius:50px;padding:7px 11px;font-size:.82rem}.card h3{font-size:1rem;margin:23px 0 10px}.card ol{padding-left:23px;line-height:1.65}.card li{margin-bottom:8px}.tip{background:#f3f6fb;border-left:3px solid #6681b8;padding:14px;border-radius:8px;line-height:1.5}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.nav button{min-width:100px}.primary{background:#182b50;color:white;border-color:#182b50}.empty{text-align:center;padding:50px 12px}.status{font-size:.78rem;margin-top:14px;text-align:center;color:#687487}label{font-size:.82rem;color:#58657b} .filter{display:grid;gap:5px}.fav{margin-left:auto}.question{border-top:1px solid #e7eaf1;padding-top:12px;margin-top:16px}.question button{margin-top:8px}.hidden{display:none}@media(max-width:480px){.shell{padding:16px 12px 36px}.card{border-radius:18px}.toolbar{margin-top:18px}.nav button{min-width:86px}}
</style></head><body><main class="shell"><header><div><h1>🧊 IceBreakers</h1><small>Facilitator's pocket deck · v0.1</small></div><button id="random" title="Pick a random activity">🎲 Surprise me</button></header><div class="toolbar"><div class="filter"><label for="category">Type</label><select id="category"><option value="">All types</option></select></div><div class="filter"><label for="duration">Time available</label><select id="duration"><option value="0">Any duration</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div></div><div class="actions"><button id="favouritesOnly" aria-pressed="false">♡ Favourites only</button><button id="copy">Copy activity</button><button id="reload">↻ Refresh</button></div><section id="card" class="card" aria-live="polite"></section><div class="nav"><button id="prev">← Previous</button><span id="count" class="muted"></span><button class="primary" id="next">Next →</button></div><p id="status" class="status"></p></main><script>
const DEMO=[{id:"IB001",title:"Two Truths and a Lie",category:"Playful",duration:10,minPeople:3,maxPeople:30,description:"Share two truths and one lie. Can the group spot the invention?",instructions:"Think of three statements about yourself: two true and one false.|Share all three without revealing the lie.|Everyone guesses, then reveal the answer.",tip:"Encourage surprising truths rather than implausible lies.",active:true},{id:"IB002",title:"The Perfect Day",category:"Thoughtful",duration:5,minPeople:2,maxPeople:30,description:"You have a day with no responsibilities and enough money to enjoy yourself, but not unlimited money. What do you do?",instructions:"Give everyone 30 seconds to imagine their day.|Invite each person to describe their day.|Ask a curious follow-up if something interesting emerges.",tip:"The realistic budget constraint makes the answers more revealing.",active:true},{id:"IB003",title:"Fast Friends",category:"Connection",duration:15,minPeople:2,maxPeople:30,description:"Build familiarity through progressively more meaningful questions.",instructions:"Pair people with someone they know less well.|Ask a series of questions, allowing both people to answer.|Move gradually from light to more reflective prompts.|Finish without requiring anyone to disclose private answers.",tip:"Let people pass. Never force personal disclosure.",active:true},{id:"IB004",title:"The Useless Superpower",category:"Playful",duration:5,minPeople:3,maxPeople:40,description:"What completely useless superpower would you choose?",instructions:"Give everyone 20 seconds to invent a power.|Share each idea.|Vote for the most impressively impractical.",tip:"Start with an absurd example to set the tone.",active:true},{id:"IB005",title:"The Unexpected Expert",category:"Connection",duration:10,minPeople:3,maxPeople:25,description:"What oddly specific subject could you talk about for ten minutes without preparation?",instructions:"Give everyone a minute to think.|Take turns revealing each specialist subject.|Invite one curious question per person.",tip:"Great for teams who know job titles but little else.",active:true},{id:"IB006",title:"Would You Rather?",category:"Playful",duration:5,minPeople:3,maxPeople:50,description:"Pick between two entertainingly difficult options.",instructions:"Read out a question.|Ask everyone to commit to an option.|Invite people from both sides to explain why.",tip:"The explanation is usually better than the answer.",active:true},{id:"IB007",title:"The Tiny Hill I'll Die On",category:"Playful",duration:10,minPeople:3,maxPeople:25,description:"What trivial opinion would you defend with unreasonable passion?",instructions:"Ask everyone to choose a harmless opinion.|Give each person 30 seconds to defend it.|Allow friendly rebuttals.",tip:"Keep topics trivial and avoid politics or personal attacks.",active:true},{id:"IB008",title:"One Small Win",category:"Thoughtful",duration:5,minPeople:2,maxPeople:30,description:"What's one small thing that has gone well recently?",instructions:"Give everyone a moment to reflect.|Invite each person to share.|Acknowledge contributions without turning this into a status meeting.",tip:"Especially useful for tired teams.",active:true}];
const params=new URLSearchParams(location.search),endpoint=params.get("api")||localStorage.getItem("icebreakers_api")||"";let all=DEMO,questions=[],visible=[],pos=0,qpos=0,questionOrders={},onlyFav=false;const $=id=>document.getElementById(id);let favourites;try{favourites=new Set(JSON.parse(localStorage.getItem("icebreakers_favourites")||"[]"))}catch{favourites=new Set()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function steps(s){return Array.isArray(s)?s:String(s||"").split("|").filter(Boolean)}
function current(){return visible[pos]}
function shuffledIndices(n){const order=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}return order}
function questionOrder(a,qs){const key=String(a.id);if(!questionOrders[key]||questionOrders[key].length!==qs.length)questionOrders[key]=shuffledIndices(qs.length);return questionOrders[key]}
function render(){const a=current();$("count").textContent=visible.length? (pos+1)+" / "+visible.length:"0 / 0";$("prev").disabled=$("next").disabled=visible.length<2;if(!a){$("card").innerHTML='<div class="empty">No matching activities. Try changing the filters.</div>';return}const qs=questions.filter(q=>String(q.activityId)===String(a.id)&&q.active!==false);qpos=Math.min(qpos,Math.max(0,qs.length-1));const order=questionOrder(a,qs);$("card").innerHTML='<div class="eyebrow">'+esc(a.category)+'</div><h2>'+esc(a.title)+'</h2><p class="prompt">'+esc(a.description)+'</p><div class="chips"><span class="chip">◷ '+esc(a.duration)+' min</span><span class="chip">♧ '+esc(a.minPeople)+'–'+esc(a.maxPeople)+' people</span></div><button id="heart" aria-pressed="'+favourites.has(a.id)+'">'+(favourites.has(a.id)?"♥ Saved":"♡ Save favourite")+'</button><h3>How to run it</h3><ol>'+steps(a.instructions).map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol><div class="tip"><strong>Facilitator tip</strong><div>'+esc(a.tip)+'</div></div>'+(qs.length?'<div class="question"><h3>Question '+(qpos+1)+' of '+qs.length+'</h3><p>'+esc(qs[order[qpos]].question)+'</p><button id="another">Another question ↻</button></div>':"");$("heart").onclick=()=>{favourites.has(a.id)?favourites.delete(a.id):favourites.add(a.id);localStorage.setItem("icebreakers_favourites",JSON.stringify([...favourites]));if(onlyFav)filter();else render()};if(qs.length)$("another").onclick=()=>{qpos=(qpos+1)%qs.length;if(qpos===0&&qs.length>1){const previous=order[order.length-1];questionOrders[String(a.id)]=shuffledIndices(qs.length);if(questionOrders[String(a.id)][0]===previous){const first=questionOrders[String(a.id)][0];questionOrders[String(a.id)][0]=questionOrders[String(a.id)][1];questionOrders[String(a.id)][1]=first}}render()}}
function filter(){const cat=$("category").value,mins=Number($("duration").value);visible=all.filter(a=>a.active!==false&&(!cat||a.category===cat)&&(!mins||Number(a.duration)<=mins)&&(!onlyFav||favourites.has(a.id)));pos=0;qpos=0;render()}
function nav(d){if(!visible.length)return;pos=(pos+d+visible.length)%visible.length;qpos=0;render()}
$("prev").onclick=()=>nav(-1);$("next").onclick=()=>nav(1);$("random").onclick=()=>{if(visible.length>1){let next=pos;while(next===pos)next=Math.floor(Math.random()*visible.length);pos=next;qpos=0;render()}};$("category").onchange=$("duration").onchange=filter;$("favouritesOnly").onclick=()=>{onlyFav=!onlyFav;$("favouritesOnly").setAttribute("aria-pressed",String(onlyFav));$("favouritesOnly").textContent=onlyFav?"♥ Favourites only":"♡ Favourites only";filter()};$("copy").onclick=async()=>{const a=current();if(!a)return;const content=[a.title,a.description,"Duration: "+a.duration+" minutes","How to run:",...steps(a.instructions).map((s,i)=>(i+1)+". "+s),"Facilitator tip: "+a.tip].join("\n");try{await navigator.clipboard.writeText(content);$("status").textContent="Copied to clipboard"}catch{$("status").textContent="Clipboard unavailable in this browser"}};let startX=null;$("card").addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX},{passive:true});$("card").addEventListener("touchend",e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>65)nav(delta<0?1:-1);startX=null},{passive:true});
async function load(){if(!endpoint){try{const [a,q]=await Promise.all([fetch("data/icebreakers.json"),fetch("data/questions.json")]);if(!a.ok||!q.ok)throw Error("Content unavailable");all=await a.json();questions=await q.json();questionOrders={};if(!Array.isArray(all)||!Array.isArray(questions))throw Error("Invalid content");const categories=[...new Set(all.map(a=>a.category).filter(Boolean))].sort();$("category").innerHTML='<option value="">All types</option>'+categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");filter();$("status").textContent="GitHub content library · "+all.length+" activities";return}catch(e){$("status").textContent="Starter library · GitHub content not available";return}}try{const response=await fetch(endpoint);if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();if(!Array.isArray(data.activities))throw Error("Invalid response");all=data.activities;questions=Array.isArray(data.questions)?data.questions:[];questionOrders={};const categories=[...new Set(all.map(a=>a.category).filter(Boolean))].sort();$("category").innerHTML='<option value="">All types</option>'+categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");filter();$("status").textContent="Live Google Sheets library · "+all.length+" activities"}catch(e){$("status").textContent="Couldn't load Google Sheets ("+e.message+"). Showing starter library."}}
$("reload").onclick=load;const initialCategories=[...new Set(all.map(a=>a.category))].sort();$("category").innerHTML+='<option value="">All types</option>'.replace('<option value="">All types</option>','')+initialCategories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");filter();load();
</script></body></html>
