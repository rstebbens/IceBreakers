:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;margin:auto;padding:22px 16px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:1.65rem;margin:0}small,.muted{color:#687487}.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0 12px}select,button{font:inherit;border:1px solid #d9dfeb;border-radius:12px;padding:11px;background:white;color:#172033}button{cursor:pointer}button:hover{border-color:#6678a0}button:focus-visible,select:focus-visible{outline:3px solid #8fa7ff}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.actions button{font-size:.9rem}.card{background:#fff;border:1px solid #e3e7ef;border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:0 16px 40px #15254312;min-height:390px;touch-action:pan-y}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#526b9d;font-size:.75rem;font-weight:750}.card h2{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.13;margin:15px 0}.prompt{font-size:1.15rem;line-height:1.55}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{background:#edf2fa;border-radius:50px;padding:7px 11px;font-size:.82rem}.card h3{font-size:1rem;margin:23px 0 10px}.card ol{padding-left:23px;line-height:1.65}.card li{margin-bottom:8px}.tip{background:#f3f6fb;border-left:3px solid #6681b8;padding:14px;border-radius:8px;line-height:1.5}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.nav button{min-width:100px}.primary{background:#182b50;color:white;border-color:#182b50}.empty{text-align:center;padding:50px 12px}.status{font-size:.78rem;margin-top:14px;text-align:center;color:#687487}label{font-size:.82rem;color:#58657b} .filter{display:grid;gap:5px}.fav{margin-left:auto}.question{border-top:1px solid #e7eaf1;padding-top:12px;margin-top:16px}.question button{margin-top:8px}.question-toolbar,.question-pages{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.question-toolbar select{width:auto;padding:7px;border:1px solid #cbd3df;border-radius:8px;background:white}.question-list{padding-left:24px;line-height:1.6}.question-list li{margin:12px 0;padding-left:3px}.question-pages button:disabled{opacity:.4;cursor:not-allowed}.question-pages span{font-size:.85rem;color:#58657b}.hidden{display:none}@media(max-width:600px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .filter:first-child{grid-column:1/-1}}@media(max-width:480px){.shell{padding:16px 12px 36px}.card{border-radius:18px}.toolbar{margin-top:18px}.nav button{min-width:86px}}
.discovery{display:flex;gap:9px;margin:15px 0 10px;align-items:center}.search-wrap{flex:1;position:relative}#search{width:100%;border:1px solid #d9dfeb;border-radius:12px;padding:12px;font:inherit;background:#fff}#searchResults{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1px solid #d9dfeb;border-radius:12px;box-shadow:0 14px 28px #15254325;max-height:300px;overflow:auto;z-index:10}#searchResults button{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:11px 13px}#searchResults button:hover{background:#edf2fa}#filterToggle{white-space:nowrap}.filter-panel{margin:0 0 13px;padding:12px;background:#eaf0f8;border-radius:14px}.filter-panel .toolbar{margin:0 0 10px}.filter-panel .actions{margin:0}.quick-times{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.quick-times button{padding:7px 11px;font-size:.82rem}.quick-times button[aria-pressed=true]{background:#182b50;color:white}.card{min-height:0}.card h2{margin:8px 0 12px}.prompt{margin:10px 0;font-size:1.06rem}.chips{margin:13px 0}.card h3{margin:15px 0 8px}.card ol{margin:8px 0}.card li{margin-bottom:5px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-tools{display:flex;gap:5px}.card-tools button{padding:6px 10px;border-radius:9px;font-size:1rem}.tip{padding:11px 13px}.filter-panel[hidden],#searchResults[hidden]{display:none}@media(max-width:480px){.discovery{gap:6px}#filterToggle{padding:11px 9px}.card-tools button{padding:6px 8px}}
.browse-overlay[hidden]{display:none}.browse-overlay{position:fixed;inset:0;background:#111c31a8;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.browse-dialog{background:#fff;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #0004}.browse-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #e3e7ef}.browse-head h2{margin:0;font-size:1.3rem}.browse-controls{padding:12px 20px;display:flex;align-items:center;gap:12px}.browse-controls input{flex:1;min-width:0;border:1px solid #d9dfeb;border-radius:10px;padding:11px;font:inherit}.browse-scroll{overflow:auto;padding:0 12px 15px}.browse-table{border-collapse:collapse;width:100%;font-size:.92rem}.browse-table th{text-align:left;position:sticky;top:0;background:#f3f6fb;color:#526079;padding:12px 10px;white-space:nowrap}.browse-table td{padding:10px;border-bottom:1px solid #edf0f5}.browse-table tbody tr{cursor:pointer}.browse-table tbody tr:hover,.browse-table tbody tr:focus{background:#edf2fa;outline:none}.browse-table td:first-child{font-weight:650}.browse-table .browse-open{border:0;background:none;text-align:left;padding:0;font-weight:650;color:#172033}.browse-table .browse-open:hover{text-decoration:underline}.browse-empty{padding:20px;text-align:center;color:#687487}.browse-count{color:#687487;font-size:.8rem;white-space:nowrap}.browse-sort{border:0;background:transparent;padding:0;font-size:inherit;font-weight:700;color:inherit}.browse-sort:hover{text-decoration:underline}@media(max-width:550px){.browse-overlay{padding:0}.browse-dialog{max-height:100vh;height:100vh;border-radius:0}.browse-head,.browse-controls{padding:12px}.browse-table th,.browse-table td{padding:10px 7px}.browse-table .interaction-col{display:none}}
</style></head><body><main class="shell"><header><div><h1>🧊 IceBreakers</h1><small>Facilitator's pocket deck · v0.1</small></div><button id="random" title="Pick a random activity">🎲 Surprise me</button></header><div class="discovery"><div class="search-wrap"><input id="search" type="search" placeholder="Find an activity…" autocomplete="off" aria-label="Find an activity"><div id="searchResults" hidden></div></div><button id="browseOpen" title="Browse all activities">☷ Browse all</button><button id="filterToggle" aria-expanded="false" aria-controls="filterPanel">☷ Filters</button></div><div class="quick-times" aria-label="Time available"><button data-time="0" aria-pressed="true">Any time</button><button data-time="5" aria-pressed="false">5 min</button><button data-time="10" aria-pressed="false">10 min</button><button data-time="15" aria-pressed="false">15 min</button><button data-time="30" aria-pressed="false">30 min</button></div><div id="filterPanel" class="filter-panel" hidden><div class="toolbar"><div class="filter"><label for="category">Type</label><select id="category"><option value="">All types</option></select></div><div class="filter"><label for="interaction">Interaction</label><select id="interaction"><option value="">Any interaction</option></select></div><div class="filter"><label for="duration">Time available</label><select id="duration"><option value="0">Any duration</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div></div><div class="actions"><button id="favouritesOnly" aria-pressed="false">♡ Favourites only</button><button id="reload">↻ Refresh</button></div></div><section id="card" class="card" aria-live="polite"></section><div class="nav"><button id="prev">← Previous</button><span id="count" class="muted"></span><button class="primary" id="next">Next →</button></div><p id="status" class="status"></p></main><div id="browseOverlay" class="browse-overlay" hidden><section class="browse-dialog" role="dialog" aria-modal="true" aria-labelledby="browseTitle"><div class="browse-head"><div><h2 id="browseTitle">Browse icebreakers</h2><small>Choose an activity to open its card</small></div><button id="browseClose" aria-label="Close activity browser">✕ Close</button></div><div class="browse-controls"><input id="browseSearch" type="search" placeholder="Search activities…" aria-label="Search activities"><span id="browseCount" class="browse-count"></span></div><div class="browse-scroll"><table class="browse-table"><thead><tr><th><button class="browse-sort" data-sort="title">Activity ↕</button></th><th><button class="browse-sort" data-sort="duration">Minutes ↕</button></th><th><button class="browse-sort" data-sort="category">Type ↕</button></th><th class="interaction-col"><button class="browse-sort" data-sort="interaction">Interaction ↕</button></th></tr></thead><tbody id="browseRows"></tbody></table><div id="browseEmpty" class="browse-empty" hidden>No matching activities</div></div></section></div><script>
const DEMO=[{id:"IB001",title:"Two Truths and a Lie",category:"Playful",duration:10,minPeople:3,maxPeople:30,description:"Share two truths and one lie. Can the group spot the invention?",instructions:"Think of three statements about yourself: two true and one false.|Share all three without revealing the lie.|Everyone guesses, then reveal the answer.",tip:"Encourage surprising truths rather than implausible lies.",active:true},{id:"IB002",title:"The Perfect Day",category:"Thoughtful",duration:5,minPeople:2,maxPeople:30,description:"You have a day with no responsibilities and enough money to enjoy yourself, but not unlimited money. What do you do?",instructions:"Give everyone 30 seconds to imagine their day.|Invite each person to describe their day.|Ask a curious follow-up if something interesting emerges.",tip:"The realistic budget constraint makes the answers more revealing.",active:true},{id:"IB003",title:"Fast Friends",category:"Connection",duration:15,minPeople:2,maxPeople:30,description:"Build familiarity through progressively more meaningful questions.",instructions:"Pair people with someone they know less well.|Ask a series of questions, allowing both people to answer.|Move gradually from light to more reflective prompts.|Finish without requiring anyone to disclose private answers.",tip:"Let people pass. Never force personal disclosure.",active:true},{id:"IB004",title:"The Useless Superpower",category:"Playful",duration:5,minPeople:3,maxPeople:40,description:"What completely useless superpower would you choose?",instructions:"Give everyone 20 seconds to invent a power.|Share each idea.|Vote for the most impressively impractical.",tip:"Start with an absurd example to set the tone.",active:true},{id:"IB005",title:"The Unexpected Expert",category:"Connection",duration:10,minPeople:3,maxPeople:25,description:"What oddly specific subject could you talk about for ten minutes without preparation?",instructions:"Give everyone a minute to think.|Take turns revealing each specialist subject.|Invite one curious question per person.",tip:"Great for teams who know job titles but little else.",active:true},{id:"IB006",title:"Would You Rather?",category:"Playful",duration:5,minPeople:3,maxPeople:50,description:"Pick between two entertainingly difficult options.",instructions:"Read out a question.|Ask everyone to commit to an option.|Invite people from both sides to explain why.",tip:"The explanation is usually better than the answer.",active:true},{id:"IB007",title:"The Tiny Hill I'll Die On",category:"Playful",duration:10,minPeople:3,maxPeople:25,description:"What trivial opinion would you defend with unreasonable passion?",instructions:"Ask everyone to choose a harmless opinion.|Give each person 30 seconds to defend it.|Allow friendly rebuttals.",tip:"Keep topics trivial and avoid politics or personal attacks.",active:true},{id:"IB008",title:"One Small Win",category:"Thoughtful",duration:5,minPeople:2,maxPeople:30,description:"What's one small thing that has gone well recently?",instructions:"Give everyone a moment to reflect.|Invite each person to share.|Acknowledge contributions without turning this into a status meeting.",tip:"Especially useful for tired teams.",active:true}];
const params=new URLSearchParams(location.search),endpoint=params.get("api")||"";let all=DEMO,questions=[],visible=[],pos=0,qpos=0,questionOrders={},questionPage=0,questionPageSize=5,onlyFav=false;const $=id=>document.getElementById(id);let favourites;try{favourites=new Set(JSON.parse(localStorage.getItem("icebreakers_favourites")||"[]"))}catch{favourites=new Set()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function steps(s){return Array.isArray(s)?s:String(s||"").split("|").filter(Boolean)}
function current(){return visible[pos]}
function shuffledIndices(n){const order=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}return order}
function questionOrder(a,qs){if(String(a.id)==="IB003")return Array.from({length:qs.length},(_,i)=>i);const key=String(a.id);if(!questionOrders[key]||questionOrders[key].length!==qs.length)questionOrders[key]=shuffledIndices(qs.length);return questionOrders[key]}
function render(){const a=current();$("count").textContent=visible.length?(pos+1)+" / "+visible.length:"0 / 0";$("prev").disabled=$("next").disabled=visible.length<2;if(!a){$("card").innerHTML='<div class="empty">No matching activities. Try changing the filters.</div>';return}const qs=questions.filter(q=>String(q.activityId)===String(a.id)&&q.active!==false),order=questionOrder(a,qs),pages=Math.max(1,Math.ceil(qs.length/questionPageSize));questionPage=Math.max(0,Math.min(questionPage,pages-1));const first=questionPage*questionPageSize,last=Math.min(first+questionPageSize,qs.length);const questionHtml=qs.length?'<div class="question"><div class="question-toolbar"><h3>Questions ('+qs.length+')</h3><label for="questionSize">Show <select id="questionSize"><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option></select> per page</label></div><ol class="question-list" start="'+(first+1)+'">'+order.slice(first,last).map(i=>'<li>'+esc(qs[i].question)+'</li>').join("")+'</ol><div class="question-pages"><button id="questionPrev" '+(questionPage===0?'disabled':'')+'>← Previous</button><span>Page '+(questionPage+1)+' of '+pages+'</span><button id="questionNext" '+(questionPage===pages-1?'disabled':'')+'>Next →</button></div></div>':"";$("card").innerHTML='<div class="card-top"><div class="eyebrow">'+esc(a.category)+' · '+esc(a.id)+'</div><div class="card-tools"><button id="heart" title="Save favourite" aria-label="Save favourite" aria-pressed="'+favourites.has(a.id)+'">'+(favourites.has(a.id)?'♥':'♡')+'</button><button id="copy" title="Copy activity" aria-label="Copy activity">⧉</button></div></div><h2>'+esc(a.title)+'</h2><p class="prompt">'+esc(a.description)+'</p><div class="chips"><span class="chip">◷ '+esc(a.duration)+' min</span><span class="chip">♧ '+esc(a.minPeople)+'–'+esc(a.maxPeople)+' people</span>'+(a.interaction?'<span class="chip">'+esc(a.interaction)+'</span>':'')+'</div><h3>How to run it</h3><ol>'+steps(a.instructions).map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol><div class="tip"><strong>Facilitator tip</strong><div>'+esc(a.tip)+'</div></div>'+questionHtml;$("heart").onclick=()=>{favourites.has(a.id)?favourites.delete(a.id):favourites.add(a.id);localStorage.setItem("icebreakers_favourites",JSON.stringify([...favourites]));if(onlyFav)filter();else render()};$("copy").onclick=copyCurrent;if(qs.length){$("questionSize").value=String(questionPageSize);$("questionSize").onchange=()=>{questionPageSize=Number($("questionSize").value);questionPage=0;render();remember()};$("questionPrev").onclick=()=>{if(questionPage>0){questionPage--;render()}};$("questionNext").onclick=()=>{if(questionPage<pages-1){questionPage++;render()}}}}
function filter(){const cat=$("category").value,interaction=$("interaction").value,mins=Number($("duration").value);visible=all.filter(a=>a.active!==false&&(!cat||(a.category===cat||(cat==="Reflective"&&a.category==="Thoughtful")))&&(!interaction||a.interaction===interaction)&&(!mins||Number(a.duration)<=mins)&&(!onlyFav||favourites.has(a.id)));pos=0;qpos=0;questionPage=0;render();syncTimes();remember()}
function nav(d){if(!visible.length)return;pos=(pos+d+visible.length)%visible.length;qpos=0;questionPage=0;render();remember()}
$("prev").onclick=()=>nav(-1);$("next").onclick=()=>nav(1);$("random").onclick=()=>{if(visible.length>1){let next=pos;while(next===pos)next=Math.floor(Math.random()*visible.length);pos=next;qpos=0;questionPage=0;render();remember()}};$("category").onchange=$("interaction").onchange=$("duration").onchange=filter;$("favouritesOnly").onclick=()=>{onlyFav=!onlyFav;$("favouritesOnly").setAttribute("aria-pressed",String(onlyFav));$("favouritesOnly").textContent=onlyFav?"♥ Favourites only":"♡ Favourites only";filter()};async function copyCurrent(){const a=current();if(!a)return;const content=[a.title,a.description,"Duration: "+a.duration+" minutes","How to run:",...steps(a.instructions).map((s,i)=>(i+1)+". "+s),"Facilitator tip: "+a.tip].join("\n");try{await navigator.clipboard.writeText(content);$("status").textContent="Copied to clipboard"}catch{$("status").textContent="Clipboard unavailable in this browser"}}let startX=null;$("card").addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX},{passive:true});$("card").addEventListener("touchend",e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>65)nav(delta<0?1:-1);startX=null},{passive:true});
function remember(){try{sessionStorage.setItem("icebreakers_view",JSON.stringify({id:current()?.id,category:$("category").value,interaction:$("interaction").value,duration:$("duration").value,onlyFav}))}catch{}}
function restore(){try{const v=JSON.parse(sessionStorage.getItem("icebreakers_view")||"{}");$("category").value=v.category||"";$("interaction").value=v.interaction||"";$("duration").value=v.duration||"0";onlyFav=!!v.onlyFav;$("favouritesOnly").setAttribute("aria-pressed",String(onlyFav));$("favouritesOnly").textContent=onlyFav?"♥ Favourites only":"♡ Favourites only";filter();const n=visible.findIndex(a=>a.id===v.id);if(n>=0){pos=n;render();remember()}}catch{filter()}}
function syncTimes(){document.querySelectorAll("[data-time]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.time===$("duration").value)))}
function searchActivities(){const term=$("search").value.trim().toLowerCase(),box=$("searchResults");if(!term){box.hidden=true;return}const matches=all.filter(a=>a.active!==false&&(a.title+" "+a.description+" "+a.category+" "+a.id).toLowerCase().includes(term)).slice(0,15);box.innerHTML=matches.length?matches.map(a=>'<button type="button" data-id="'+esc(a.id)+'">'+esc(a.title)+' <small>· '+esc(a.duration)+' min</small></button>').join(""):'<div style="padding:12px">No matching activities</div>';box.hidden=false}
$("search").oninput=searchActivities;$("searchResults").onclick=e=>{const btn=e.target.closest("button[data-id]");if(!btn)return;const id=btn.dataset.id;$("category").value="";$("interaction").value="";$("duration").value="0";onlyFav=false;$("favouritesOnly").setAttribute("aria-pressed","false");$("favouritesOnly").textContent="♡ Favourites only";filter();const i=visible.findIndex(a=>a.id===id);if(i>=0){pos=i;render()}$("search").value="";$("searchResults").hidden=true;syncTimes();remember()};
$("filterToggle").onclick=()=>{const panel=$("filterPanel");panel.hidden=!panel.hidden;$("filterToggle").setAttribute("aria-expanded",String(!panel.hidden))};
document.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{$("duration").value=b.dataset.time;filter()});
let browseSort="title",browseAsc=true,browseFocus=null;
function drawBrowse(){
  const term=$("browseSearch").value.trim().toLowerCase();
  const rows=visible.filter(a=>(a.title+" "+a.description+" "+a.category+" "+(a.interaction||"")).toLowerCase().includes(term)).slice();
  rows.sort((a,b)=>{const av=browseSort==="duration"?Number(a.duration):String(a[browseSort]||"");const bv=browseSort==="duration"?Number(b.duration):String(b[browseSort]||"");const c=typeof av==="number"?av-bv:av.localeCompare(bv);return (browseAsc?1:-1)*c||a.title.localeCompare(b.title)});
  $("browseRows").innerHTML=rows.map(a=>'<tr><td><button class="browse-open" data-id="'+esc(a.id)+'">'+esc(a.title)+'</button></td><td>'+esc(a.duration)+'</td><td>'+esc(a.category)+'</td><td class="interaction-col">'+esc(a.interaction||"—")+'</td></tr>').join("");
  $("browseCount").textContent=rows.length+" of "+visible.length;
  $("browseEmpty").hidden=rows.length>0;
}
function closeBrowse(){ $("browseOverlay").hidden=true;document.body.style.overflow="";browseFocus?.focus()}
$("browseOpen").onclick=()=>{browseFocus=document.activeElement;$("browseOverlay").hidden=false;document.body.style.overflow="hidden";$("browseSearch").value="";drawBrowse();$("browseSearch").focus()};
$("browseClose").onclick=closeBrowse;
$("browseOverlay").onclick=e=>{if(e.target===$("browseOverlay"))closeBrowse()};
$("browseSearch").oninput=drawBrowse;
$("browseRows").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const i=visible.findIndex(a=>a.id===b.dataset.id);if(i>=0){pos=i;questionPage=0;render();remember()}closeBrowse()};
document.querySelectorAll(".browse-sort").forEach(b=>b.onclick=()=>{if(browseSort===b.dataset.sort)browseAsc=!browseAsc;else{browseSort=b.dataset.sort;browseAsc=true}drawBrowse()});
document.addEventListener("keydown",e=>{if($("browseOverlay").hidden)return;if(e.key==="Escape")closeBrowse();else if(e.key==="Tab"){const focusable=[...$("browseOverlay").querySelectorAll('button,input')].filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function populateFilters(){const categories=[...new Set(all.map(a=>a.category==="Thoughtful"?"Reflective":a.category).filter(Boolean))].sort();$("category").innerHTML='<option value="">All types</option>'+categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");const interactions=[...new Set(all.map(a=>a.interaction).filter(Boolean))].sort();$("interaction").innerHTML='<option value="">Any interaction</option>'+interactions.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join("")}
async function load(){
  $("status").textContent="Loading icebreakers…";
  let localError=null;
  try{
    const [a,q]=await Promise.all([fetch("data/icebreakers.json",{cache:"no-store"}),fetch("data/questions.json",{cache:"no-store"})]);
    if(!a.ok||!q.ok)throw Error("HTTP "+a.status+"/"+q.status);
    const activities=await a.json(),questionBank=await q.json();
    if(!Array.isArray(activities)||!Array.isArray(questionBank))throw Error("Invalid JSON content");
    all=activities;questions=questionBank;questionOrders={};populateFilters();restore();syncTimes();
    $("status").textContent="GitHub content library · "+all.length+" activities";
  }catch(e){localError=e;$("status").textContent="Couldn't load GitHub library ("+e.message+"). Showing starter activities."}
  if(!endpoint)return;
  try{
    const response=await fetch(endpoint);
    if(!response.ok)throw Error("HTTP "+response.status);
    const data=await response.json();
    if(!Array.isArray(data.activities))throw Error("Invalid response");
    all=data.activities;questions=Array.isArray(data.questions)?data.questions:[];
    questionOrders={};populateFilters();filter();
    $("status").textContent="External library · "+all.length+" activities";
  }catch(e){
    $("status").textContent=localError?"Couldn't load either content source. Showing starter activities.":"External library unavailable ("+e.message+"). Showing GitHub library · "+all.length+" activities";
  }
}
$("reload").onclick=load;populateFilters();render();load();
</script></body></html>
